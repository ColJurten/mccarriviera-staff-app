<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <title>Synthetic US-009 signing experiment</title>
  <h1>Desktop signing experiment</h1>
  <p>
    Paste the local signing URL. Use a private browser session. Nothing is saved
    by this harness.
  </p>
  <label>Signing URL <input id="url" type="url" size="75" /></label>
  <button id="tab">Open tab</button>
  <button id="embed">Try iframe</button>
  <p>
    Record: browser/version, draw count, taps per field/page, completion time,
    embedding errors.
  </p>
  <p>Drawing and Adobe Reader seal checks: « to confirm by hand ».</p>
  <iframe title="Documenso signing" style="width: 100%; height: 80vh"></iframe>
  <script>
    function signingUrl() {
      const url = new URL(document.querySelector('#url').value);
      if (
        url.origin !== 'http://localhost:3000' ||
        !url.pathname.startsWith('/sign/')
      ) {
        throw new Error('Use the local Documenso signing URL');
      }
      return url.href;
    }
    document.querySelector('#tab').onclick = () =>
      window.open(signingUrl(), '_blank', 'noopener,noreferrer');
    document.querySelector('#embed').onclick = () => {
      document.querySelector('iframe').src = signingUrl();
    };
  </script>
</html>
