name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Prepare disposable local configuration
        run: |
          export LOCAL_SECRETS_DIR="$RUNNER_TEMP/mcr-local"
          bash scripts/local-secrets.sh
          echo "LOCAL_ENV_FILE=$LOCAL_SECRETS_DIR/local.env" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL 17 and Garage
        run: |
          timeout 300 docker compose --env-file "$LOCAL_ENV_FILE" -f deploy/compose.local.yml up -d --build --wait postgres garage
          timeout 120 docker compose --env-file "$LOCAL_ENV_FILE" -f deploy/compose.local.yml run --build --rm --no-deps garage-init
      - name: Migrations, schema drift and API integration
        run: |
          set -a
          source "$LOCAL_ENV_FILE"
          set +a
          pnpm db:migrate
          pnpm db:migrate
          export DB_DISPOSABLE=1
          pnpm db:seed
          pnpm db:seed
          pnpm test --filter db
          pnpm db:check
          pnpm --filter @mccarriviera/api test:integration
      - name: Build API container
        run: timeout 300 docker compose --env-file "$LOCAL_ENV_FILE" -f deploy/compose.local.yml build api
      - name: Remove disposable services and volumes
        if: always() && env.LOCAL_ENV_FILE != ''
        run: docker compose --env-file "$LOCAL_ENV_FILE" -f deploy/compose.local.yml down -v
